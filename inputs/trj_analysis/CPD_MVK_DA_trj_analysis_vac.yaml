# run_trajectory_analysis.py input YAML - CPD_MVK_DA trajectory analysis (vacuum MD).
# Analyses the run_mlip_md.py trajectories from inputs/md/CPD_MVK_DA_dynamics_vac.yaml in the r1-r2 plane (out/trj/CPD_MVK_DA_vac_opt_TS_<model>_300K_1.0ps*_traj.xyz).

# Run with:
#   rmlt run-trajectory-analysis inputs/trj_analysis/CPD_MVK_DA_trj_analysis_vac.yaml

# Paths are relative to the repository root.

# === 1. TRAJECTORY SOURCE ===
traj_type: CPD_MVK_DA_vac_opt_TS
run_name: "300K_1.0ps"
ts_ref_fp: data/reaction_data/CPD_MVK_DA/TS/CPD_MVK_DA_vac_TS_wB97M.xyz

# === 2. REACTION COORDINATE / PRODUCT CONFIG DEFINITIONS ===
num_solute_atoms: 22
threshold: 1.8
r1_atoms: [1, 12]
r2_atoms: [6, 11]
r3_atoms: [2, 17]
# the first config_def is the reactant definition (used for trajectory truncation)
config_defs:
  - {name: RS, r1: false, r2: false}
  - {name: PS, r1: true, r2: true}
  - {name: PS2, r3: true}
  - {name: PS3, r1: true, r2: false, r3: false}

# === 3. MODELS (trajectory-name labels; must match the run_mlip_md config used) ===
system_ft_name: CPD_MVK_DA_train
n: 42
sample_str: "ts_gauss_"
energy_str: "energy_"
omol_energy_str: "energy_"
model_names:
  - GO-MACE-23_${system_ft_name}_${n}_config_${energy_str}${sample_str}ft
  - MACE-OFF23_${system_ft_name}_${n}_config_${energy_str}${sample_str}ft
  - MACE-MP-0b3_medium_${system_ft_name}_${n}_config_${energy_str}${sample_str}ft
  - MACE-omol-0-extra-large-1024_${system_ft_name}_${n}_config_${omol_energy_str}${sample_str}ft

# === 4. PLOT SETTINGS ===
save_name: CPD_MVK_DA_vac_opt_TS_paper_models
traj_trunc: [3.5, 3.5]
r1_range: [4.0, 1.0]
r2_range: [5.0, 1.0]
show_legend: false
