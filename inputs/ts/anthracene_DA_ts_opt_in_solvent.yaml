# run_mlip_ts_opt.py input YAML - anthracene_DA Diels-Alder TS optimisation in toluene.
# Dimer-method MLIP TS search in vacuum, followed by solvation, MD equilibration with a frozen solute, and a frozen-solvent TS re-optimisation.

# Run with:
#   rmlt run-mlip-ts-opt inputs/ts/anthracene_DA_ts_opt_in_solvent.yaml

# Paths are relative to the repository root.

# === 1. SELECT INPUT CONFIG (TS GUESS) ===
save_name: anthracene_DA
react_coords: [[2, 20], [5, 22]]
num_solute_atoms: 41
input_config_fp: data/reaction_data/anthracene_DA/TS/anthracene_DA_TS_MMFF_opt.xyz
ref_config_fp: data/reaction_data/anthracene_DA/TS/anthracene_DA_vac_TS_wB97M.xyz
reverse_displace: false

# === 2. SELECT MODEL ===
# fine-tuned model-naming components (used by the ${...} templating in model_names)
system_ft_name: anthracene_DA_train
n: 46
sample_str: ""
energy_str: "energy_"
rep_num: 2
omol_rep_num: 3
omol_energy_str: "energy_"

model_names:
  - GO-MACE-23_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-OFF23_medium_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-MP-0b3_medium_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-omol-0-extra-large-1024_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${omol_energy_str}rep_${omol_rep_num}

# === 3. SOLVENT ===
include_solvent: true
solvent_xyz_fpath: data/solvents/toluene.xyz
solvent_name: toluene
solvent_density: 0.8603
atoms_per_solv_mol: 15
solvation_box_size: 21.0
solv_shell_cutoff: 0.0

# === 4. OPTIMISER / RUN SETTINGS ===
out_dir: out/opt
fmax: 0.001
displace_mag: 0.05
enable_cueq: false
override_cache: false
cuda_device: "cuda:0"
