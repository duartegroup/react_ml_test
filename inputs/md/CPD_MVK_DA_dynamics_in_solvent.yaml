# run_mlip_md.py input YAML - CPD_MVK_DA MLIP MD dynamics in water.
# Runs MD trajectories starting from each model's in-water-optimised TS
# (out/opt/CPD_MVK_DA_in_water_<model>_opt_TS.xyz).
#
# Run with:
#   rmlt run-mlip-md inputs/md/CPD_MVK_DA_dynamics_in_solvent.yaml
#
# Paths are relative to the repository root.

# === 1. SYSTEM / STARTING CONFIGS ===
system_name: CPD_MVK_DA
include_solvent: true
solvent_name: water

# === 2. MD SETTINGS ===
fs: 1000
temp: 300
dt: 0.5
interval: 20
md_method: "ase"
num_init_configs: 1
md_runs_per_config: 100

# === 3. MODELS (fine-tuned; base_model_names + naming components below) ===
base_model_names:
  - GO-MACE-23
  - MACE-OFF23_medium
  - MACE-MP-0b3_medium
  - MACE-omol-0-extra-large-1024
system_ft_name: CPD_MVK_DA_train
n: 42
sample_str: "ts_gauss_"
energy_str: "energy_"
rep_num: 1
omol_rep_num: 1
omol_energy_str: "energy_"

# === 4. RUN OPTIONS ===
enable_cueq: false
override_saved: false
cuda_device: "cuda:0"
