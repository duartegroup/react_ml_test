# run_mlip_md.py input YAML - CPD_MVK_DA MLIP MD dynamics in vacuum.
# Runs MLIP MD trajectories starting from each model's vacuum-optimised TS (out/opt/CPD_MVK_DA_vac_<model>_opt_TS.xyz).

# Run with:
#   rmlt run-mlip-md inputs/md/CPD_MVK_DA_dynamics_vac.yaml

# Paths are relative to the repository root.

# === 1. SYSTEM / STARTING CONFIGS ===
system_name: CPD_MVK_DA
include_solvent: false        # true: start from the in-solvent-optimised TS of each model
solvent_name: None

# === 2. MD SETTINGS ===
fs: 1000
temp: 300
dt: 0.5
interval: 20
md_method: "ase"
num_init_configs: 1
md_runs_per_config: 10

# === 3. MODELS (zero-shot + fine-tuned; naming components used by the ${...} templating) ===
model_names:
  - GO-MACE-23_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-OFF23_medium_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-MP-0b3_medium_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-omol-0-extra-large-1024_${system_ft_name}_${n}_config_strat_${sample_str}fine_tuned_${omol_energy_str}rep_${omol_rep_num}
system_ft_name: CPD_MVK_DA_train
n: 42
sample_str: "ts_gauss_"
energy_str: "energy_"
rep_num: 1
omol_rep_num: 1
omol_energy_str: "energy_"

# === 4. RUN OPTIONS ===
enable_cueq: false
override_saved: false
cuda_device: "cuda:0"

# === 5. MD CHECKPOINTS (optional) ===
# save_md_checkpoints writes a resumable checkpoint per run under out/md_checkpoints, every
# checkpoint_every ps of simulated time, and load_md_checkpoint carries each run on from its
# checkpoint instead of starting it over - e.g. re-submitting a job that hit its time limit.
# An explicit path resumes a single run from that one checkpoint.
save_md_checkpoints: false
load_md_checkpoint: false     # or e.g. "out/md_checkpoints/<traj name>_checkpoint.yaml"
checkpoint_every: 10          # ps
