# run_test_set_comparison.py input YAML - CPD_MVK_DA fine-tuned (FT42) test-set comparison.
# Compares zero-shot and fine-tuned MLIP energies / forces against DFT on the CPD_MVK_DA test set.

# Run with:
#   rmlt run-test-set-comparison inputs/test/CPD_MVK_DA_FT42_test.yaml

# Paths are relative to the repository root.

n: 42
train_name: CPD_MVK_DA_train
test_name: CPD_MVK_DA_test
sample_str: "ts_gauss_"
rep_num: 1
energy_str: energy_
omol_rep_num: 1
omol_energy_str: energy_
model_names:
  - GO-MACE-23
  - GO-MACE-23_${train_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-OFF23_medium
  - MACE-OFF23_medium_${train_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-MP-0b3_medium
  - MACE-MP-0b3_medium_${train_name}_${n}_config_strat_${sample_str}fine_tuned_${energy_str}rep_${rep_num}
  - MACE-omol-0-extra-large-1024
  - MACE-omol-0-extra-large-1024_${train_name}_${n}_config_strat_${sample_str}fine_tuned_${omol_energy_str}rep_${omol_rep_num}
test_set_ids:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
save_name: paper_select_ft_models
run_names:
  - ''
plot: true
num_base_models: 4
num_base_model_comps: 2
alpha_list:
  - 0.3
  - 0.9

# === RUN SETTINGS ===
# device for the MLIP calculators; "cpu" can be set here, and a device that cannot be
# found on this machine also falls back to "cpu"
cuda_device: "cuda:0"
